{% extends "maintenance/technician/base.html" %}
{% block title %}เข้าสู่ระบบ{% endblock %}
{% block content %}
<h1>เข้าสู่ระบบงานซ่อม</h1>
<p>ใช้ชื่อผู้ใช้และรหัสผ่านที่ได้รับจากผู้ดูแล</p>
<form method="post" class="panel">
    {% csrf_token %}
    {% if form.errors %}
    <div class="notice error" role="alert">เข้าสู่ระบบไม่ได้ กรุณาตรวจสอบชื่อผู้ใช้และรหัสผ่าน</div>
    {% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <label for="id_username">ชื่อผู้ใช้</label>
    <input id="id_username" name="username" autocomplete="username" autocapitalize="none"
           value="{{ form.username.value|default_if_none:'' }}" required autofocus>
    <label for="id_password">รหัสผ่าน</label>
    <input id="id_password" name="password" type="password" autocomplete="current-password" required>
    <button class="button primary wide" type="submit">เข้าสู่ระบบ</button>
</form>
{% endblock %}
